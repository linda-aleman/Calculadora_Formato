<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos -->
    <style>

        /* Contenedor principal */
        .calculadora-container {
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .pantalla {
            width: 100%;
            height: 60px;
            font-size: 28px;
            text-align: right;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            background-color: #fff;
        }
        
        /* Estilos para botones */
        .btn-calculadora {
            height: 60px;
            font-size: 30px;
            margin: 5; 
        }
        
        /* Botones de operaciones */
        .btn-operacion {
            background-color: #f0ad4e;
            color: white;
        }
        
        /* Botón igual */
        .btn-igual {
            background-color: #5cb85c;
            color: white;
        }
        
        /* Botón limpiar */
        .btn-limpiar {
            background-color: #d9534f;
            color: white;
            height: 70px;
            font-size: 35px;
        }
        
        /* Botón boton de retroceso */
        .btn-retroceso {
            background-color: #5bc0de;
            color: white;
            height: 70px;
            font-size: 35px;
        }
        
        /* Estilo para el historial */
        .historial {
            font-size: 16px;
            color: #6c757d;
            min-height: 24px;
        }

    </style>
</head>

<body class="bg-light">
    <div class="container">
        <!-- Contenedor de la calculadora -->
        <div class="calculadora-container">
            <h2 class="text-center mb-4">Calculadora</h2>
            
            <form action="{{url_for('calculadora')}}" method="POST" id="form-calculadora">
                
                <!-- Pantalla con historial -->
                <div class="historial mb-1">{{transformar}}</div>
                <input type="text" 
                       class="form-control pantalla mb-3" 
                       name="pantalla" id="pantalla" 
                       readonly 
                       value="{% if resultado %}{{ resultado[0] if resultado else '' }}{% endif %}">
                
                <!-- Fila de botones (C y ⌫) -->
                       <div class="row mb-2">
                    <div class="col-6">
                        <button type="button" 
                                class="btn btn-limpiar w-100" 
                                onclick="limpiar()">C</button>
                    </div>
                    <div class="col-6">
                        <button type="button" 
                                class="btn btn-retroceso w-100" 
                                onclick="retroceder()">⌫</button>
                    </div>
                </div>
                
                <!-- Segunda fila de botones (7 8 9 /) -->
                <div class="row mb-2">
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100" 
                                onclick="agregar('7')">7</button>
                    </div>
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100"  
                                onclick="agregar('8')">8</button>
                    </div>
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100" 
                                onclick="agregar('9')">9</button>
                    </div>
                    <div class="col-3">
                        <button type="button" 
                        class="btn btn-operacion btn-calculadora w-100" 
                        onclick="agregar('/')">/</button>
                    </div>
                </div>
                
                 <!-- Tercera fila de botones (4 5 6 ×) -->
                <div class="row mb-2">
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100" 
                                onclick="agregar('4')">4</button>
                    </div>
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100" 
                                onclick="agregar('5')">5</button>
                    </div>
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100" 
                                onclick="agregar('6')">6</button>
                    </div>
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-operacion btn-calculadora w-100" 
                                onclick="agregar('*')">×</button>
                    </div>
                </div>
                
                <!-- Cuarta fila de botones (1 2 3 -) -->
                <div class="row mb-2">
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100" 
                                onclick="agregar('1')">1</button>
                    </div>
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100" 
                                onclick="agregar('2')">2</button>
                    </div>
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100" 
                                onclick="agregar('3')">3</button>
                    </div>
                    <div class="col-3">
                        <button type="button" 
                                class="btn btn-operacion btn-calculadora w-100" 
                                onclick="agregar('-')">-</button>
                    </div>
                </div>
                 
                <!-- Quinta fila de botones (0 . = +) -->
                <div class="row">
                    <div class="col-3 mb-2">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100" 
                                onclick="agregar('0')">0</button>
                    </div>
                    <div class="col-3 mb-2">
                        <button type="button" 
                                class="btn btn-secondary btn-calculadora w-100" 
                                onclick="agregar('.')">.</button>
                    </div>
                    <div class="col-3 mb-2">
                        <button type="submit" 
                                class="btn btn-igual btn-calculadora w-100">=</button>
                    </div>
                    <div class="col-3 mb-2">
                        <button type="button" 
                                class="btn btn-operacion btn-calculadora w-100" 
                                onclick="agregar('+')">+</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="{{url_for('static', filename='pantalla.js')}}"></script>
</body>
</html>
