<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos -->
    <style>
        /* Contenedor principal de bienvenida */
        .welcome-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* Contenedor de imagen */
        .contenedor-de-imagen {
            text-align: center;
        }

    </style>
</head>

<body class="bg-light">
    <div class="container">

        <!-- Sección de bienvenida -->
        <div class="welcome-container">
            <h1 class="mb-4">{{saludo}}</h1>
            <a href="{{url_for('calculadora')}}" class="btn btn-primary btn-lg">Ir a la Calculadora</a>
        </div>
    </div>
    
    <!-- Contenedor de imagen -->
    <div class="contenedor-de-imagen">
       <img src="https://img.freepik.com/vector-premium/adorable-icono-vectorial-calculadora-dibujos-animados-expresion-cara-sonriente_1263357-23586.jpg?semt=ais_hybrid" width="200" height="150" alt="calcuadora">
    </div>
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>  
</html>
